<!DOCTYPE html>
<html lang="en">

<head>
    {{- partial "head.html" . -}}
</head>

<body>
    {{- partial "header.html" . -}}
    <main>
        <form 
            id="report-form" 
            name="report-download" 
            method="POST" 
            data-netlify="true" 
            netlify-honeypot="bot-field"
            class="p-10 bg-white shadow-2xl rounded-2xl m-10 flex gap-6 flex-col max-w-md mx-auto border border-gray-100"
        >
            <input type="hidden" name="form-name" value="report-download" />
            <input type="hidden" name="bot-field" />
            <input type="hidden" name="report_title" value="{{ .Params.Title }}" />

            <div class="text-center">
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Download Report</h3>
                <p class="text-gray-500 text-sm">Please provide your details to access "{{ .Params.Title }}"</p>
            </div>
            
            <hr class="border-gray-100">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input 
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all"
                        placeholder="John Doe" 
                        name="name" 
                        type="text"
                        required
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Company</label>
                    <input 
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all"
                        placeholder="Company Name" 
                        name="company" 
                        type="text"
                        required
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input 
                        class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all"
                        placeholder="name@example.com" 
                        name="email" 
                        type="email"
                        required
                    >
                </div>
            </div>

            <button 
                id="download" 
                data-report="{{ .Params.file }}" 
                type="submit"
                class="w-full bg-red-600 text-white font-bold py-4 px-8 rounded-lg transition duration-300 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 text-lg shadow-lg shadow-red-200 disabled:bg-gray-300 disabled:shadow-none"
            >
                Download Report
            </button>
        </form>

        <script>
            const form = document.getElementById('report-form');
            const downloadBtn = document.getElementById('download');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = new FormData(form);
                const reportUrl = downloadBtn.getAttribute('data-report');
                const reportTitle = "{{ .Params.Title | safeJS }}";

                // Disable button and show loading
                downloadBtn.disabled = true;
                const originalText = downloadBtn.textContent;
                downloadBtn.textContent = 'Processing...';

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: new URLSearchParams(formData).toString()
                    });

                    if (response.ok) {
                        // Trigger download
                        const anchor = document.createElement('a');
                        anchor.href = reportUrl;
                        anchor.download = `${reportTitle}.pdf`;
                        document.body.appendChild(anchor);
                        anchor.click();
                        document.body.removeChild(anchor);
                        
                        // Reset form
                        form.reset();
                        alert('Thank you! Your download should start shortly.');
                    } else {
                        throw new Error('Form submission failed');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('There was a problem processing your request. Please try again.');
                } finally {
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = originalText;
                }
            });
        </script>

    </main>
    {{- partial "footer.html" . -}}

</body>

</html>
