{{/* layouts/partials/header.html */}}
{{ $currentPage := . }}
<div x-data="{ mobileMenuOpen: false }" class="relative">
 <div class="bg-white border-b border-gray-100">
   <div class="max-w-[1440px] mx-auto px-4 lg:px-8">
     <div class="flex justify-between items-center h-20">
       <div class="brand flex-shrink-0">
         <a href="/" class="home-link">
           <img src="/images/fiqa.png" alt="fiqa" class="h-16 w-auto">
         </a>
       </div>

       <div class="hidden md:flex items-center space-x-8">
         <a href="/about" class="text-sm font-medium text-gray-700 hover:text-gray-900">About Us</a>
         <a href="/contact" class="text-sm font-medium text-gray-700 hover:text-gray-900">Contact Us</a>
         <button class="p-2 hover:bg-gray-100 rounded-lg">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
           </svg>
         </button>
       </div>

       <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 hover:bg-gray-100 rounded-lg">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
         </svg>
       </button>
     </div>
   </div>
 </div>

 <div class="sticky top-0 z-40 bg-gray-800 shadow-lg">
   <div class="max-w-[1440px] mx-auto">
     <!-- Desktop menu -->
     <div class="hidden md:flex">
       {{ range .Site.Menus.main }}
       <a href="{{ .URL }}" class="flex-1 group">
         <div class="py-5 px-6 text-center {{ if eq $currentPage.RelPermalink .URL }} bg-red-600 {{ else }} hover:bg-red-600/90 {{ end }}">
           <span class="text-sm font-medium text-white">{{ .Name }}</span>
         </div>
       </a>
       {{ end }}
     </div>

     <!-- Mobile submenu -->
     <div class="md:hidden">
       <div class="overflow-x-auto scrollbar-hide">
         <div class="flex whitespace-nowrap">
           {{ range .Site.Menus.main }}
           <a href="{{ .URL }}" class="inline-block">
             <div class="py-4 px-5 text-center {{ if eq $currentPage.RelPermalink .URL }} bg-red-600 {{ else }} hover:bg-red-600/90 {{ end }}">
               <span class="text-sm font-medium text-white">{{ .Name }}</span>
             </div>
           </a>
           {{ end }}
         </div>
       </div>
     </div>
   </div>
 </div>

 <div x-show="mobileMenuOpen"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-x-full"
      x-transition:enter-end="opacity-100 translate-x-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-x-0"
      x-transition:leave-end="opacity-0 translate-x-full"
      class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-50 md:hidden">
   <div class="flex flex-col h-full">
     <div class="flex items-center justify-between p-5 border-b border-gray-100">
       <span class="text-lg font-semibold text-gray-900">Menu</span>
       <button @click="mobileMenuOpen = false" class="p-2 hover:bg-gray-100 rounded-lg">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
         </svg>
       </button>
     </div>

     <nav class="flex-1 overflow-y-auto">
       <div class="px-3 py-4">
         <div class="mb-4 pb-4 border-b border-gray-100">
           <a href="/about" class="flex items-center px-4 py-3 text-sm text-gray-700 hover:text-red-600 hover:bg-red-50 rounded-lg">About Us</a>
           <a href="/contact" class="flex items-center px-4 py-3 text-sm text-gray-700 hover:text-red-600 hover:bg-red-50 rounded-lg">Contact Us</a>
         </div>

         <div class="space-y-1">
           {{ range .Site.Menus.main }}
           <a href="{{ .URL }}" class="flex items-center px-4 py-3 rounded-lg text-sm font-medium text-gray-700 hover:text-red-600 hover:bg-red-50">
             {{ .Name }}
           </a>
           {{ end }}
         </div>
       </div>
     </nav>
   </div>
 </div>

 <div x-show="mobileMenuOpen" 
      @click="mobileMenuOpen = false"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 md:hidden">
 </div>
</div>

<style>
 .scrollbar-hide::-webkit-scrollbar {
   display: none;
 }
 .scrollbar-hide {
   -ms-overflow-style: none;
   scrollbar-width: none;
 }
</style>
