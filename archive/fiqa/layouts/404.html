<head>
    {{ partial "head.html" . }}
</head>

<body class="bg-gradient-to-b from-red-50 to-white font-sans">
    {{- partial "header.html" . -}}
    <main class="container mx-auto px-4 py-16 max-w-none">
        <div class="w-full">
            <article class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-12">
                    <!-- Elevator Icon -->
                    <div class="mb-8">
                        <div class="mx-auto w-32 h-48 border-4 border-red-600 rounded-t-xl relative">
                            <div class="absolute inset-x-4 top-4 bottom-4 bg-red-500 elevator-doors rounded"></div>
                            <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-6 h-2 bg-red-700 rounded"></div>
                        </div>
                    </div>
                    <span class="inline-block bg-red-100 text-red-600 text-sm font-semibold px-4 py-2 rounded-full mb-4">ERROR 404</span>
                    <h1 class="text-4xl md:text-6xl font-bold text-gray-900 mb-4">Floor Not Found</h1>
                    <div class="w-24 h-1 bg-red-500 mx-auto mb-8"></div>
                </div>
                <div class="max-w-4xl mx-auto mb-12">
                    <p class="text-gray-600 text-center text-lg">
                        Looks like you've pressed the wrong button! This floor doesn't exist in our building.
                        Let's get you back to the lobby.
                    </p>
                </div>
                <div class="text-center">
                    <a href="/" class="inline-flex items-center justify-center bg-red-600 text-white font-semibold py-3 px-8 rounded-lg hover:bg-red-700 transition duration-300 transform hover:-translate-y-1 hover:shadow-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                        </svg>
                        Return to Lobby
                    </a>
                </div>
            </article>
        </div>
    </main>
</body>
