<article class="group relative aspect-[.92] overflow-hidden rounded-[1.4rem] bg-[#d8cbb8]">
  {{ partial "image.html" (dict "src" .image "alt" .alt "class" "absolute inset-0 h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" "sizes" "(max-width: 640px) 50vw, (max-width: 1024px) 33vw, 25vw") }}
  <div class="absolute inset-0 bg-gradient-to-t from-foreground/90 via-foreground/5 to-transparent"></div>
  <h3 class="display-face absolute inset-x-4 bottom-4 text-xl font-semibold leading-tight text-card sm:text-2xl">{{ .label }}</h3>
</article>
