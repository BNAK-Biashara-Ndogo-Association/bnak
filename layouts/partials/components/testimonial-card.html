<figure class="surface-card flex min-h-[220px] flex-col p-6 sm:p-8">
  <div class="flex items-center justify-between">
    <svg class="h-6 w-6 text-secondary" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.17 6A5.17 5.17 0 0 0 2 11.17V18h7v-6H5.5a3.5 3.5 0 0 1 3.5-3.5V6H7.17Zm10 0A5.17 5.17 0 0 0 12 11.17V18h7v-6h-3.5a3.5 3.5 0 0 1 3.5-3.5V6h-1.83Z"/></svg>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-muted px-3 py-1 text-xs font-bold text-foreground">
      <span class="h-1.5 w-1.5 rounded-full bg-primary" aria-hidden="true"></span> Member voice
    </span>
  </div>
  <blockquote class="display-face mt-5 flex-1 text-xl font-semibold leading-snug text-foreground sm:text-2xl">“{{ .quote }}”</blockquote>
  <figcaption class="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-border pt-4">
    <div>
      <span class="block font-bold text-foreground">{{ .name }}</span>
      <span class="mt-0.5 block text-xs text-muted-foreground">{{ .role }} &middot; <span class="font-medium text-secondary">{{ .location }}</span></span>
    </div>
    <span class="text-xs font-semibold text-muted-foreground">{{ .category }}</span>
  </figcaption>
</figure>
