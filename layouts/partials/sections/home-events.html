{{ $section := .Params.events }}
<section id="events" class="border-y border-border bg-[#eee6d7] py-20 lg:py-24" aria-labelledby="home-events-heading">
  <div class="section-wrap flex flex-col justify-between gap-6 sm:flex-row sm:items-end">
    <div>
      <p class="mono-face text-[11px] font-bold uppercase tracking-[.18em] text-secondary">{{ $section.eyebrow }}</p>
      <h2 id="home-events-heading" class="display-face mt-4 text-5xl font-semibold leading-[.94] tracking-[-.04em] sm:text-6xl">{{ $section.title }}</h2>
      <p class="mt-5 max-w-2xl text-base leading-relaxed text-muted-foreground">{{ $section.intro }}</p>
    </div>
    <a href="{{ "/events/" | relURL }}" class="inline-flex shrink-0 items-center gap-2 font-bold text-secondary">{{ $section.action }} <span aria-hidden="true">→</span></a>
  </div>
</section>
