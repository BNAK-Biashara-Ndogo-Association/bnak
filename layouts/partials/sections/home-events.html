{{ $section := .Params.events }}
<section id="events" class="border-y border-border bg-muted py-16 sm:py-20" aria-labelledby="home-events-heading">
  <div class="section-wrap flex flex-col justify-between gap-6 sm:flex-row sm:items-end">
    <div>
      <p class="mono-face text-xs font-bold uppercase tracking-[.16em] text-primary">{{ $section.eyebrow }}</p>
      <h2 id="home-events-heading" class="display-face mt-4 max-w-3xl text-4xl font-semibold leading-tight tracking-[-.03em] sm:text-5xl">{{ $section.title }}</h2>
      <p class="mt-5 max-w-2xl text-base leading-relaxed text-muted-foreground">{{ $section.intro }}</p>
      <p class="mt-4 text-sm font-semibold text-foreground">Event dates are shared as county chapters confirm them.</p>
    </div>
    <a href="{{ "/events/" | relURL }}" class="inline-flex min-h-11 shrink-0 items-center gap-2 rounded-full bg-primary px-5 py-3 font-bold text-primary-foreground">View event updates <span aria-hidden="true">&rarr;</span></a>
  </div>
</section>
