{{ $section := .Params.info }}
<section class="section-wrap py-16 sm:py-24" aria-labelledby="stories-heading">
  <div class="hero-panel">
    <p class="mono-face text-[11px] font-bold uppercase tracking-[.18em] text-secondary">{{ $section.eyebrow }}</p>
    <h1 id="stories-heading" class="hero-title">{{ $section.title }}</h1>
    <p class="hero-intro mt-7">{{ $section.intro }}</p>
    <a href="mailto:{{ site.Data.contact.email }}?subject=Share%20a%20BNAK%20member%20story" class="mt-8 inline-flex items-center gap-2 rounded-full bg-primary px-5 py-3 font-bold text-primary-foreground">Ask about sharing a story <span aria-hidden="true">→</span></a>
  </div>
</section>
