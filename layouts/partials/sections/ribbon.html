<section class="section-wrap pb-12" aria-label="Farming and farmer community">
  <div class="image-ribbon flex gap-3 overflow-x-auto sm:grid sm:grid-cols-3 sm:overflow-visible" data-image-ribbon>
    {{ range .Params.ribbon }}
      <figure class="group min-w-[84%] snap-start overflow-hidden rounded-2xl border border-border bg-card sm:min-w-0">
        <div class="aspect-[1.55] overflow-hidden bg-[#e9e1d2]">
          {{ partial "image.html" (dict "src" .src "alt" .alt "class" "h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" "sizes" "(max-width: 640px) 100vw, 33vw") }}
        </div>
        <figcaption class="p-4">
          <p class="mono-face text-[10px] font-bold uppercase tracking-[.16em] text-secondary">{{ .title }}</p>
          <p class="mt-1 text-sm leading-relaxed text-muted-foreground">{{ .caption }}</p>
        </figcaption>
      </figure>
    {{ end }}
  </div>
</section>
