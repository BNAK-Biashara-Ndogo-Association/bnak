{{/* Donate Section */}}
<section id="donate" class="section-wrap py-16 bg-primary text-primary-foreground" aria-labelledby="donate-heading">
  <div class="max-w-3xl mx-auto text-center">
    <p class="mono-face text-[10px] font-bold uppercase tracking-widest text-primary-foreground">Back the movement</p>
    <h2 id="donate-heading" class="display-face mt-4 text-4xl font-semibold leading-none">Keep the work moving.</h2>
    <p class="mt-4 text-base leading-relaxed text-primary-foreground/90">Your support helps us bring practical tools, community and opportunity to more business owners across Kenya.</p>
    <form class="mt-7 space-y-4">
      <label class="block text-sm font-bold">
        Your name
        <input required type="text" placeholder="e.g. Amina Otieno" class="mt-2 w-full rounded-xl border border-primary-foreground/30 bg-primary-foreground/10 px-4 py-3 font-normal outline-none transition-shadow focus:ring-2 focus:ring-accent" />
      </label>
      <label class="block text-sm font-bold">
        Email address
        <input required type="email" placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-primary-foreground/30 bg-primary-foreground/10 px-4 py-3 font-normal outline-none transition-shadow focus:ring-2 focus:ring-accent" />
      </label>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="rounded-xl border py-3 text-sm font-bold transition-colors border-accent bg-accent/20">KES 500</button>
        <button type="button" class="rounded-xl border py-3 text-sm font-bold transition-colors border-primary-foreground/30 hover:border-accent hover:bg-accent/20">KES 1,000</button>
        <button type="button" class="rounded-xl border py-3 text-sm font-bold transition-colors border-primary-foreground/30 hover:border-accent hover:bg-accent/20">Other</button>
      </div>
      <button type="submit" class="w-full rounded-full bg-accent py-4 font-bold text-accent-foreground transition-colors hover:bg-accent/90">Continue with KES 500</button>
      <p class="mt-3 text-sm opacity-85">🔒 Secure and encrypted SSL donation processing</p>
    </form>
  </div>
</section>
