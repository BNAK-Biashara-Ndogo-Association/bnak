{{ $section := .Params.academy }}
<section class="section-wrap py-2" aria-labelledby="academy-heading">
  <a href="{{ "/programs/" | relURL }}" class="group block rounded-[1.8rem] bg-accent p-7 text-left transition-transform hover:-translate-y-1 sm:p-9">
    <div class="flex items-start justify-between gap-4"><span class="grid h-12 w-12 place-items-center rounded-full bg-foreground text-accent" aria-hidden="true">✳</span><span class="text-xl text-secondary" aria-hidden="true">↗</span></div>
    <p class="mono-face mt-10 text-[10px] font-bold uppercase tracking-[.18em] text-secondary">{{ $section.eyebrow }}</p>
    <h2 id="academy-heading" class="display-face mt-3 text-3xl font-semibold leading-tight text-foreground">{{ $section.title }}</h2>
    <p class="mt-3 max-w-lg text-sm leading-relaxed text-foreground/80">{{ $section.intro }}</p>
  </a>
</section>
