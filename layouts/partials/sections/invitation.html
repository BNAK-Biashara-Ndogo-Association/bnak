{{ $section := .Params.invitation }}
<section class="bg-primary py-16 text-background">
  <div class="section-wrap grid items-center gap-8 sm:grid-cols-[1.2fr_.8fr]">
    <div>
      <p class="mono-face text-[11px] font-bold uppercase tracking-[.18em] text-primary-foreground">{{ $section.eyebrow }}</p>
      <h2 class="display-face mt-4 max-w-2xl text-4xl font-semibold leading-[.92] tracking-[-.04em] sm:text-6xl">{{ $section.title }}</h2>
    </div>
    <div>
      <p class="text-base leading-relaxed text-primary-foreground/90">{{ $section.intro }}</p>
      <div class="mt-6 flex flex-wrap gap-3">
        <a href="{{ site.Params.ctaURL }}" target="_blank" rel="noopener noreferrer" class="button-secondary px-6 py-4">{{ $section.joinLabel }} <span aria-hidden="true">&rarr;</span></a>
        <a href="{{ "/partners/" | relURL }}" class="button-quiet border-background/70 text-background hover:bg-background/10 hover:text-background">{{ $section.supportLabel }} <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
  </div>
</section>
