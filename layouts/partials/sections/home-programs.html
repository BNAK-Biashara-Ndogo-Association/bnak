{{ $section := .Params.programs }}
<section id="programs" class="bg-foreground py-24 text-background lg:py-32" aria-labelledby="home-programs-heading">
  <div class="section-wrap">
    <div class="flex flex-col justify-between gap-7 sm:flex-row sm:items-end">
      <div>
        <p class="mono-face text-[11px] font-bold uppercase tracking-[.18em] text-accent">{{ $section.eyebrow }}</p>
        <h2 id="home-programs-heading" class="display-face mt-4 max-w-[550px] text-5xl font-semibold leading-[.94] tracking-[-.04em] sm:text-6xl">{{ $section.title }}</h2>
      </div>
      <p class="max-w-xs text-sm leading-relaxed text-background/80">{{ $section.intro }}</p>
    </div>
    <div class="mt-16 grid gap-4 md:grid-cols-3">
      {{ range site.Data.programs }}
        <a href="{{ "/programs/" | relURL }}" class="group relative flex min-h-[320px] flex-col justify-end overflow-hidden rounded-2xl bg-[#245847] p-7 transition-transform duration-500 hover:-translate-y-2">
          <span class="absolute right-5 top-5 grid h-10 w-10 place-items-center rounded-full bg-accent text-xs font-bold text-foreground">{{ .number }}</span>
          <span class="mb-auto grid h-12 w-12 place-items-center rounded-full border border-[#6d9584] text-xl text-accent" aria-hidden="true">✳</span>
          <h3 class="display-face mt-10 text-3xl font-semibold">{{ .title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-background/80">{{ .text }}</p>
          <span class="mt-6 inline-flex items-center gap-2 text-sm font-bold text-accent">See what's inside <span class="transition-transform group-hover:translate-x-1" aria-hidden="true">→</span></span>
        </a>
      {{ end }}
    </div>
    <a href="{{ "/membership/" | relURL }}" class="mt-12 inline-flex items-center gap-2 border-b border-accent pb-1 font-bold text-accent">{{ $section.membershipLink }} <span aria-hidden="true">→</span></a>
  </div>
</section>
