{{ $section := .Params.programs }}
<section id="programs" class="bg-background py-16 text-foreground sm:py-20 lg:py-24" aria-labelledby="home-programs-heading">
  <div class="section-wrap">
    <div class="flex flex-col justify-between gap-6 sm:flex-row sm:items-end">
      <div>
        <p class="mono-face text-xs font-bold uppercase tracking-[.16em] text-primary">{{ $section.eyebrow }}</p>
        <h2 id="home-programs-heading" class="display-face type-h2 mt-4 max-w-[22ch] font-semibold tracking-[-.03em]">{{ $section.title }}</h2>
      </div>
      <p class="max-w-md text-base leading-relaxed text-muted-foreground">{{ $section.intro }}</p>
    </div>
    <div class="mt-10 grid gap-4 md:grid-cols-3">
      {{ range site.Data.programs }}
        <a href="{{ "/programs/" | relURL }}" class="group relative flex min-h-[300px] flex-col justify-end overflow-hidden rounded-2xl bg-primary p-6 text-primary-foreground shadow-sm transition-transform duration-300 hover:-translate-y-1 sm:p-7">
          <span class="mb-auto grid h-11 w-11 place-items-center rounded-full border border-white/40 text-primary-foreground" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </span>
          <h3 class="display-face mt-8 text-2xl font-semibold sm:text-3xl">{{ .title }}</h3>
          <p class="mt-3 text-base leading-relaxed text-primary-foreground/90">{{ .text }}</p>
          <span class="mt-5 inline-flex items-center gap-2 text-sm font-bold text-primary-foreground">Explore program <span class="transition-transform group-hover:translate-x-1" aria-hidden="true">&rarr;</span></span>
        </a>
      {{ end }}
    </div>
    <a href="{{ "/membership/" | relURL }}" class="button-secondary mt-8">{{ $section.membershipLink }} <span aria-hidden="true">&rarr;</span></a>
  </div>
</section>
