{{ $section := .Params.contact }}
<section id="contact" class="border-y border-border bg-muted py-7" aria-label="{{ $section.eyebrow }}">
  <div class="section-wrap flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
    <div>
      <p class="mono-face text-[10px] font-bold uppercase tracking-[.17em] text-secondary">{{ $section.eyebrow }}</p>
      <p class="mt-1 text-sm text-muted-foreground">{{ $section.intro }}</p>
    </div>
    <div class="flex flex-wrap items-center gap-3 text-sm font-bold">
      <a href="{{ site.Data.contact.whatsAppLink }}" target="_blank" rel="noopener noreferrer" class="button-primary">WhatsApp BNAK</a>
      <a href="{{ site.Data.contact.phoneLink | safeURL }}" class="inline-flex min-h-11 items-center px-2 text-primary underline-offset-4 hover:underline">Call {{ site.Data.contact.phone }}</a>
      <a href="mailto:{{ site.Data.contact.email }}" class="inline-flex min-h-11 items-center px-2 text-primary underline-offset-4 hover:underline">Email BNAK</a>
    </div>
  </div>
</section>
