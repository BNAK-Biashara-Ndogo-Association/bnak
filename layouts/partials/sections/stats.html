<div class="mt-20 grid gap-4 border-t border-border pt-6 sm:grid-cols-3" role="group" aria-label="BNAK at a glance">
  {{ range .Params.stats }}
    <div class="border-b border-border pb-6 sm:border-b-0 sm:border-r sm:pb-0 sm:pl-6 first:pl-0 last:border-0">
      <p class="display-face text-5xl font-semibold text-primary">{{ .value }}</p>
      <p class="mt-2 max-w-[170px] text-sm leading-snug text-muted-foreground">{{ .label }}</p>
    </div>
  {{ end }}
</div>
