<div class="mt-20 grid grid-cols-3 border-t border-border pt-6" role="group" aria-label="BNAK at a glance">
  {{ range .Params.stats }}
    <div class="border-r border-border pl-3 pr-3 sm:pl-6 sm:pr-6 first:pl-0 last:pr-0 last:border-r-0">
      <p class="display-face text-2xl min-[400px]:text-3xl sm:text-4xl lg:text-5xl font-semibold text-primary tracking-tight">{{ .value }}</p>
      <p class="mt-1.5 sm:mt-2 text-xs sm:text-sm leading-snug text-muted-foreground sm:max-w-[170px]">{{ .label }}</p>
    </div>
  {{ end }}
</div>
