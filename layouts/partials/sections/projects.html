{{ $section := .Params.projects }}
<section id="projects" class="section-wrap py-16 sm:py-24" aria-labelledby="projects-heading">
  <div class="rounded-[2rem] bg-foreground p-7 text-background sm:p-12">
    <p class="mono-face text-[11px] font-bold uppercase tracking-[.18em] text-accent">{{ $section.eyebrow }}</p>
    <h2 id="projects-heading" class="display-face mt-5 max-w-4xl text-5xl font-semibold leading-[.94] tracking-[-.04em] sm:text-7xl">{{ $section.title }}</h2>
    <p class="mt-7 max-w-3xl text-lg leading-relaxed text-background/80">{{ $section.intro }}</p>
  </div>
  <div class="mt-10 grid gap-4 lg:grid-cols-2">
    {{ range $index, $project := hugo.Data.projects }}
      {{ partial "components/project-card.html" (dict "project" $project "index" (add $index 1)) }}
    {{ end }}
  </div>
</section>
