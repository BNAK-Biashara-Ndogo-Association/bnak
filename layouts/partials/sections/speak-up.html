{{ $section := .Params.speakUp }}
<section class="section-wrap py-4" aria-labelledby="speak-up-heading">
  <div class="grid items-center gap-6 rounded-[1.8rem] bg-primary p-7 text-background sm:grid-cols-[1fr_auto] sm:p-9">
    <div>
      <p class="mono-face text-[10px] font-bold uppercase tracking-[.18em] text-primary-foreground">{{ $section.eyebrow }}</p>
      <h2 id="speak-up-heading" class="display-face mt-3 text-3xl font-semibold leading-tight sm:text-4xl">{{ $section.title }}</h2>
      <p class="mt-3 max-w-2xl text-sm leading-relaxed text-primary-foreground/90">{{ $section.intro }}</p>
    </div>
    <div class="flex flex-wrap gap-3">
      <a href="{{ site.Data.contact.whatsAppLink }}?text=Hello+BNAK+Legal+Desk%2C+I+need+assistance+with+a+business+issue%2Fharassment." target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center rounded-full bg-accent px-5 py-3 font-bold text-accent-foreground transition-colors hover:bg-card">WhatsApp Helpline &rarr;</a>
      <a href="mailto:{{ site.Data.contact.email }}?subject=MSME%20Advocacy%20Assistance" class="inline-flex items-center justify-center rounded-full border border-background/60 px-5 py-3 font-bold text-background transition-colors hover:bg-background hover:text-foreground">Email BNAK</a>
    </div>
  </div>
</section>
