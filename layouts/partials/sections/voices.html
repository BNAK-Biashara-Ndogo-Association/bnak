{{ $section := .Params.voices }}
<section id="voices" class="section-wrap py-14 sm:py-20" aria-labelledby="kenyan-voices-heading">
  <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
    {{ partial "components/section-heading.html" (dict "eyebrow" $section.eyebrow "title" $section.title) }}
    <p class="max-w-sm text-sm leading-relaxed text-muted-foreground">{{ $section.intro }}</p>
  </div>
  <div class="mt-8 grid gap-4 md:grid-cols-2">
    {{ range hugo.Data.testimonials }}{{ partial "components/testimonial-card.html" . }}{{ end }}
  </div>
</section>
