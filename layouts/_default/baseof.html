<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="theme-color" content="#173d33">
  <meta property="og:title" content="{{ .Title }} | BNak">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ "images/market_stall.jpg" | absURL }}">
  <link rel="icon" type="image/svg+xml" href="{{ "bnak.svg" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/compiled.css" | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</head>
<body class="page-grain min-h-[100dvh] overflow-x-hidden bg-[#f5f0e5] text-[#173d33]" data-page="{{ .Params.panel | default "home" }}">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-0 focus:z-50 focus:bg-white focus:p-4">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="pt-[76px]">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  <dialog id="bnak-dialog" aria-labelledby="modal-title"></dialog>
  {{ range seq 4 }}<template id="membership-step-{{ . }}">{{ partial (printf "journey/step-%d.html" .) $ }}</template>{{ end }}
  <template id="donate-template">{{ partial "journey/donate.html" . }}</template>
  <script id="bnak-data" type="application/json">{{ site.Data.bnak | jsonify | safeJS }}</script>
</body>
</html>
