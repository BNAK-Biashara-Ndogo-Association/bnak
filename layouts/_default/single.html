<!doctype html>
<html lang="en-KE">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-grain min-h-[100dvh] overflow-x-hidden bg-[#fafafa] text-[#276ba4]" data-page="{{ .Params.panel | default "page" }}">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-0 focus:z-50 focus:bg-white focus:p-4">Skip to content</a>

  {{ partial "header.html" . }}

  <main id="main" class="pt-[76px]">
    {{ if .Params.panel }}
      {{ partial (printf "pages/%s.html" .Params.panel) . }}
    {{ else }}
      {{ .Content }}
    {{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ partial "modals.html" . }}
</body>
</html>
