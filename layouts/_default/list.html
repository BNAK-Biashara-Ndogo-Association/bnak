{{ define "main" }}
  <section class="section-wrap py-16 sm:py-24">
    <h1 class="display-face text-5xl font-semibold tracking-tight sm:text-7xl">{{ .Title }}</h1>
    {{ with .Content }}<div class="prose prose-lg mt-6 max-w-3xl">{{ . }}</div>{{ end }}
    <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {{ range .Pages }}
        <article class="rounded-2xl border border-border bg-card p-6">
          <h2 class="display-face text-2xl font-semibold"><a href="{{ .RelPermalink }}" class="hover:text-secondary">{{ .Title }}</a></h2>
          {{ with .Description }}<p class="mt-3 text-sm leading-relaxed text-muted-foreground">{{ . }}</p>{{ end }}
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
