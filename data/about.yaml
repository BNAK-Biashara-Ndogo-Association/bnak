images:
  - src: "images/sectors/avocado_farmer.jpg"
    alt: "Kenyan avocado farmer holding a harvest in an orchard"
  - src: "images/sectors/emobility_rider.jpg"
    alt: "Kenyan electric motorcycle rider at work"
  - src: "images/sectors/inclusive-business.jpg"
    alt: "Kenyan women in business, including a wheelchair-using tailoring entrepreneur"
  - src: "images/sectors/youth-business.jpg"
    alt: "Young Kenyan entrepreneurs running a phone-repair business"
values:
  - title: "Move clean"
    text: "We promote e-mobility for riders, couriers and local fleets so Kenyan businesses can cut fuel costs and protect the air we share."
    tone: "green"
  - title: "Protect what sustains us"
    text: "From farms to guesthouses, we help MSMEs turn resource care, local sourcing and resilient operations into good business."
    tone: "cream"
  - title: "Build belonging"
    text: "A fair economy is designed with young people, women and people with disabilities at the table from the start."
    tone: "coral"
priorities:
  - title: "Youth development"
    text: "Enterprise skills, mentors and first-market opportunities for young Kenyans turning ideas into income."
  - title: "Women in business"
    text: "Peer circles and finance-readiness support that recognise women as owners, employers and decision-makers."
  - title: "Access for all"
    text: "Accessible learning, inclusive networks and visibility for entrepreneurs with disabilities."
