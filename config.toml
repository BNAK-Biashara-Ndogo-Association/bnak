baseURL = 'https://bnak.co.ke/'
languageCode = 'en-KE'
title = 'BNak | Biashara Ndogo Association of Kenya'
disableKinds = ['taxonomy', 'term']

[params]
  description = "BNak (Biashara Ndogo Association of Kenya) is the home of Kenya's micro and small enterprises — uniting mama mboga, boda boda operators, artisans, and grassroots entrepreneurs for voice, dignity, and economic progress."
  keywords = ["Biashara Ndogo", "BNAK", "MSME Kenya", "small business Kenya", "micro enterprises Kenya", "Mama Mboga", "boda boda association", "grassroots businesses Kenya", "Kenya informal sector", "business advocacy Kenya", "entrepreneurship Kenya"]
  author = "Biashara Ndogo Association of Kenya"
  siteName = "Biashara Ndogo Association of Kenya (BNAK)"
  email = "hello@bnak.co.ke"
  ctaURL = "https://wa.me/254711422163"
  contactPhone = "+254711422163"

[build]
  [build.buildStats]
    enable = true
    disableClasses = false
    disableIDs = true
    disableTags = true

  [[build.cachebusters]]
    source = "layouts/.*"
    target = "css"

  [[build.cachebusters]]
    source = "content/.*"
    target = "css"

  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[sitemap]
  changefreq = 'weekly'
  priority = 0.8
  filename = 'sitemap.xml'

[markup.goldmark.renderer]
  unsafe = false

[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
